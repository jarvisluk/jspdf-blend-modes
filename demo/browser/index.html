<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jspdf-blend-modes — demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f0f12;
        --fg: #f0f0f5;
        --muted: #9a9aa3;
        --accent: #ffb84a;
        --card: #18181d;
        --border: #2a2a31;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
        min-height: 100vh;
      }
      header {
        padding: 32px 24px 16px;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      header p { margin: 0; color: var(--muted); max-width: 60ch; }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 24px;
      }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .card h2 { margin: 0 0 12px; font-size: 14px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }
      .preview {
        background: #fff;
        border-radius: 4px;
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .preview svg { width: 100%; height: 100%; display: block; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
      button {
        appearance: none;
        background: var(--accent);
        color: #1a1305;
        border: 0;
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
      }
      button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      pre {
        margin: 0;
        padding: 8px 10px;
        background: #0a0a0d;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--muted);
        max-height: 220px;
        overflow: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>jspdf-blend-modes</h1>
      <p>
        Round-trip CSS <code>mix-blend-mode</code> from a live SVG into a real
        PDF 1.4 blend-mode PDF, via jsPDF + svg2pdf.js.
      </p>
    </header>
    <main>
      <section class="card">
        <h2>Live preview</h2>
        <div id="preview" class="preview"></div>
        <div class="actions">
          <button id="btn-naive" class="secondary">Naive svg2pdf (broken)</button>
          <button id="btn-low">Low-level withBlendMode</button>
          <button id="btn-high">renderSvgWithBlendModes</button>
        </div>
      </section>
      <section class="card">
        <h2>Log</h2>
        <pre id="log">Click a button to export a PDF.</pre>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

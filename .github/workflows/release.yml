name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # `id-token: write` is required both for npm provenance and for npm Trusted
  # Publishing (OIDC) — npm CLI will pick up the OIDC token automatically when
  # the package has a trusted publisher configured on the registry side.
  # See https://docs.npmjs.com/trusted-publishers
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: changesets release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires npm CLI >= 11.5.1, which currently
          # only ships with Node >= 22.14. Node 22 LTS is the safe floor.
          node-version: "22.14.0"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Even Node 22.14 ships an npm older than 11.5.1, so we bump npm in
      # the runner before publishing. This is a no-op for the build/test
      # steps but is the difference between OIDC working and not.
      - name: Ensure npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # Build before either publishing or opening the version PR so the
      # changeset publish step has dist/ ready and the PR's lockfile keeps
      # in sync with any new size-limit numbers.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Make the changesets CLI directly available so changesets/action can
      # invoke its `version` / `publish` commands without depending on a
      # devDependency entry in this repo.
      - name: Install changesets CLI
        run: npm install --no-save --no-audit --no-fund @changesets/cli@^2.27.7

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: this workflow publishes via npm Trusted Publishing
          # (OIDC). The `id-token: write` permission above lets the npm CLI
          # exchange the workflow's GitHub OIDC token for a short-lived
          # publish credential. To re-introduce a token fallback (e.g. for
          # an emergency hand-publish), add NPM_TOKEN here and recreate the
          # secret — but prefer fixing the OIDC config on npmjs.com instead.

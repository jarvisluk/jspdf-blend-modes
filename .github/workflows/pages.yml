name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one in-flight Pages deploy at a time. Don't cancel an in-progress
# release deploy when a new commit lands; queue instead so each main
# commit produces a deployable artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install root deps so the demo's Vite alias (`jspdf-blend-modes` →
      # `../../src/index.ts`) can resolve `jspdf` and `svg2pdf.js` types
      # during the demo build.
      - name: Install root deps
        run: npm ci

      - name: Install demo deps
        working-directory: demo/browser
        run: npm install --no-audit --no-fund

      - name: Build demo
        working-directory: demo/browser
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/browser/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
